services:
  api:
    build: ./backend
    ports:
      - '3001:3000'
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/blog
      - JWT_SECRET=troque-esta-chave-em-producao
      - CORS_ORIGIN=*
      - DEFAULT_TEACHER_NAME=Professor Administrador
      - DEFAULT_TEACHER_EMAIL=professor@escola.com
      - DEFAULT_TEACHER_PASSWORD=professor123
      - SEED_DEMO_DATA=true
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
